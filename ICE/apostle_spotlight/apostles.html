<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        

            body{
                background-color: #e8eced;
                font-family: Arial, sans-serif;
            }
            h1 {color: #e8eced;}
            h2 {color: #e8eced;}
        .card{
    
             background-image: url(images/christus.webp);
             background-position: center; 
             background-attachment: fixed;
            background-color: rgb(5, 54, 190);
              width: 100%;
              height: fit-content;
              border-width: 10px;
              border: 15px solid black;
              border-radius: 4em;
              text-align: center;
         }
        .first {
            display: grid;
             grid-template-columns: repeat(3, minmax(200px, 1fr));
            
             gap: 16px; 
             padding: 16px;
        
        }
            #oaks {
                width: 100%;
        }
     
      .first img {
                border-width: 15px;
                border-radius: 80%;
                border: 15px solid #e8eced;   
                justify-self: center;  
                width: 80%;
                
          }
        .apostles {
            display: grid;
            grid-template-columns: repeat(4, minmax(250px, 1fr));
            grid-row: auto;
            row-gap: 10px;
        
        }   
        .apostles img {
             border-width: 15px;
                border-radius: 80%;
                border: 15px solid #e8eced;
                width: 80%;
    
        }











        


    </style>
</head>
<body>
    <div class="card">
        
        <h1>First Presidency</h1>
       <header>
         <div class="first">
             
             <img id="eyring" src="images/eyring.webp" alt="President Eyring">
              <img id="oaks" src="images/oaks.webp" alt="President Oaks">
             <img id="christofferson" src="images/christofferson.webp" alt="President Christofferson">
         
         </div>
        </header>
        <h2>Quorum of the Twelve Apostles</h2>
        <div class="apostles">
            
            <img id="uchtdorf" src="images/uchtdorf.webp" alt="President Uchtdorf">
            <img id="bednar" src="images/bednar.webp" alt="President Bednar">
            <img id="cook" src="images/cook.webp" alt="President Cook">
            <img id="anderson" src="images/anderson.webp" alt="President Anderson">
            <img id="rasband" src="images/rasband.webp" alt="President Rasband">
            <img id="stevenson" src="images/stevenson.webp" alt="President Stevenson">
            <img id="renlund" src="images/renlund.webp" alt="President Renlund">
            <img id="gong" src="images/gong.webp" alt="President Gong">
            <img id="soares" src="images/soares.webp" alt="President Soares">
            <img id="kearon" src="images/kearon.webp" alt="President Kearon">
            <img id="causse" src="images/causse.webp" alt="President Causse">
            <img id="gilbert" src="images/gilbert.webp" alt="President Gilbert">

        </div>
    </div>
    
</body>
</html>
