<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        font-family {
            font-family: Helvetica, sans-serif;;
        }
        body {
             font-size: 22px;
            color: #ffecd7;
            text-align: center;
        }
        .card {
         background-color: #008db1;
         border: #004e63 50px;
         border-radius: 10px;
         text-align: center;
         padding: 50px 200px;
         margin: 50px 250px;
         font-style: Helvetica;
        } 
           h1 {
        color: #fffffe;
      }
     #subtitle {
        color: #91e4fb;
      }

    #info {
        color: #fffffe;
        padding: none;
        text-align: left;
        justify-self: center;
     }


    p {
        color: #ffd783;
        font-style: "Brush Script MT", "Nanum Brush Script";
     }
     .prophet {
        border: #fffffe;
        box-shadow: inset;
        justify-self: center;
     }

    </style>
</head>
<body>
   <div class="card">
     <header>
         <h1>Dallin H. Oaks </h1>
     </header>
        <div id="subtitle">
            <a href="https://www.churchofjesuschrist.org/?lang=eng">18th President of the Church of Jesus Christ of Latter-day Saints</a>
        </div>
            <img class="prophet" src="images/oaks.webp" alt="Dallin H. Oaks portrait">
        <div id="info">
            <ul>
            <li> Born: Aug 12, 1932 </li>
            <li> Apostle: Apr 7, 1984 </li>
         <li> Prophet: Oct 14, 2025 </li>
         <li> Cosmo at BYU game: Feb 24, 1979 </li>
         </ul>
        </div>
     <p> As we strive to be kind we draw closer to him and his loving influence </p>
    </div>


</body>
</html>
